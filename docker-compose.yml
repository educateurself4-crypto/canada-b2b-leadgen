version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: leadgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadgen_scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.scheduler"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadgen_dashboard
    restart: unless-stopped
    command: ["python", "-m", "app.dashboard.app"]
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./exports:/app/exports

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: leadgen_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    env_file: .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/data/workflows

volumes:
  pgdata:
  n8n_data:
